name: Sync upstream

# GitHub cannot trigger a fork's workflow from a push to someone else's repo,
# so poll: every six hours, and on demand from the Actions tab.
#
# Two jobs on purpose. `test` runs upstream's build and tests, which is
# arbitrary code from a repo this fork does not control, so it has no secrets.
# `push` holds SYNC_TOKEN but runs on a fresh runner that never executed that
# code: it redoes the rebase and only pushes if the result is byte-identical
# (same tree) to what `test` verified.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  test:
    # Only the fork runs this; upstream's own copy of the repo never should.
    if: github.repository == 'akeslo/vorssaint-utils'
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      moved: ${{ steps.check.outputs.moved }}
      tree: ${{ steps.result.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the committer
        run: |
          git config user.name "akeslo"
          git config user.email "akeslonotifications@gmail.com"
          git remote add upstream https://github.com/vorssaint/vorssaint-utils.git

      - name: Check whether upstream moved
        id: check
        run: |
          git fetch --quiet upstream
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "main already contains upstream/main ($(git rev-parse --short upstream/main))"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provide timeout (not on macOS runners)
        if: steps.check.outputs.moved == 'true'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Rebase onto upstream
        if: steps.check.outputs.moved == 'true'
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/sync-upstream.sh --no-push --no-test
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.check.outputs.moved == 'true'
        run: timeout 600 ./build.sh --test

  push:
    needs: test
    if: needs.test.outputs.moved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the committer
        run: |
          git config user.name "akeslo"
          git config user.email "akeslonotifications@gmail.com"
          git remote add upstream https://github.com/vorssaint/vorssaint-utils.git
          echo "BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Redo the rebase and compare with what was tested
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_TREE: ${{ needs.test.outputs.tree }}
        run: |
          scripts/sync-upstream.sh --no-push --no-test
          test "$(git rev-parse 'HEAD^{tree}')" = "$TESTED_TREE"

      - name: Push
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease="main:$BEFORE" origin main

  report:
    needs: [test, push]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for a failed sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Upstream sync needs attention"
          body="The scheduled sync of \`main\` onto upstream/main failed (conflict, test failure or push). Run \`scripts/sync-upstream.sh\` locally. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "$body"
          fi
